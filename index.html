<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Huhu Miao's Network Log</title>
    <style>
        :root {
            --color-calendar-graph-day-bg: #ebedf0;
            --color-calendar-graph-day-L1-bg: #fecaca;
            --color-calendar-graph-day-L2-bg: #f87171;
            --color-calendar-graph-day-L3-bg: #ef4444;
            --color-calendar-graph-day-L4-bg: #b91c1c;
            --color-text-primary: #24292f;
            --color-text-muted: #57606a;
            --color-border-default: #d0d7de;
            --color-accent-fg: #0969da;
        }

        * { box-sizing: border-box; }

        /* 1. Sticky Footer 布局基础 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            background: #fff; 
            color: var(--color-text-primary);
        }

        /* 2. 内容包装器：统一控制对齐和响应式页边距 */
        .content-wrapper {
            width: 100%;
            max-width: 848px; /* 800px内容 + 两侧各24px边距 */
            padding: 50px 24px 0 24px; /* 增加窄屏时的水平边距至 24px */
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 核心：确保内部元素全部左对齐 */
            min-height: 100vh; /* 确保内容区至少占满一屏，footer 被推到下方需要滚动 */
        }

        /* 统计标题：现在与展板左对齐 */
        .header-stats {
            width: 100%;
            font-size: 16px; 
            margin-bottom: 12px; 
            font-weight: 400; 
            text-align: left;
        }

        /* 展板容器 */
        .calendar-card {
            width: 100%;
            border: 1px solid var(--color-border-default);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 24px;
            background: #fff;
        }

        /* 滚动条逻辑：隐藏原生滚动条，使用自定义滚动条 */
        .scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .scroll-wrapper::-webkit-scrollbar { display: none; }
        .scroll-wrapper { -ms-overflow-style: none; scrollbar-width: none; }

        /* 自定义滚动条容器 */
        .custom-scrollbar-track {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            pointer-events: none;
        }
        .custom-scrollbar-thumb {
            position: absolute;
            height: 100%;
            min-width: 30px;
            background: #d0d7de;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .custom-scrollbar-thumb.visible {
            opacity: 1;
        }

        /* Tooltip 坐标修复 */
        #tooltip {
            position: fixed;
            background: #24292f; color: #fff;
            padding: 8px 12px; font-size: 12px; border-radius: 6px;
            pointer-events: none; visibility: hidden; opacity: 0;
            transition: opacity 0.1s ease; white-space: nowrap; z-index: 1000;
            transform: translate(-50%, -100%) translateY(-10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        #tooltip::after {
            content: ""; position: absolute; bottom: -5px; left: 50%;
            transform: translateX(-50%); border-width: 5px 5px 0;
            border-style: solid; border-color: #24292f transparent transparent;
        }

        .label { fill: var(--color-text-muted); font-size: 10px; }
        .day:hover { stroke: rgba(0,0,0,0.1); stroke-width: 1px; }

        .calendar-footer {
            margin-top: 16px; display: flex; 
            justify-content: space-between; align-items: center;
        }
        .footer-link { font-size: 12px; color: var(--color-text-muted); text-decoration: none; }
        .legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-text-muted); }
        .legend-box { width: 10px; height: 10px; border-radius: 2px; }

        .about-section {
            width: 100%;
            font-size: 14px; line-height: 1.8;
            text-align: justify; word-break: break-all;
            margin-bottom: 40px;
        }
        .about-section a { color: var(--color-accent-fg); text-decoration: none; }

        /* 3. 沉底页脚声明 */
        .site-footer {
            padding: 24px 0;
            border-top: 1px solid var(--color-border-default);
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: var(--color-text-muted);
            background-color: #f6f8fa;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .site-footer.visible {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .content-wrapper { padding-top: 30px; }
            .header-stats { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <h2 class="header-stats" id="total-count">Calculating...</h2>

        <div class="calendar-card">
            <div id="tooltip"></div>
            <div class="scroll-area" style="position: relative;">
                <div class="scroll-wrapper" id="scroll-container">
                    <svg id="calendar-svg" width="780" height="130"></svg>
                </div>
                <div class="custom-scrollbar-track">
                    <div class="custom-scrollbar-thumb" id="scrollbar-thumb"></div>
                </div>
            </div>
            
            <div class="calendar-footer">
                <span class="footer-link">Huhumeow Status</span>
                <div class="legend">
                    <span>Less</span>
                    <div class="legend-box" style="background: var(--color-calendar-graph-day-bg);"></div>
                    <div class="legend-box" style="background: var(--color-calendar-graph-day-L1-bg);"></div>
                    <div class="legend-box" style="background: var(--color-calendar-graph-day-L2-bg);"></div>
                    <div class="legend-box" style="background: var(--color-calendar-graph-day-L3-bg);"></div>
                    <div class="legend-box" style="background: var(--color-calendar-graph-day-L4-bg);"></div>
                    <span>More</span>
                </div>
            </div>
        </div>

        <div class="about-section">
            <p>因众所周知的原因，呼呼喵需使用大量妙妙工具来访问互联网。即便已花费大量金钱和时间配置道具，它们仍会因各种原因停止运作。</p>
            <p>尝试访问 Claude 可以有效检查自己的网络环境。当无法访问 Claude 时，我会更新 Github 仓库中的 json。本网页负责可视化这些信息，展示联网困境。</p>
            <p>欢迎访问呼呼喵的 <a href="https://github.com/HuhuMeow" target="_blank">Github 主页</a>。</p>
        </div>
    </div>

    <footer class="site-footer">
        <i>This page was crafted by Claude Opus 4.6 & Gemini 3 Thinking</i>
    </footer>

    <script>
        const year = 2026;
        const svg = document.getElementById('calendar-svg');
        const tooltip = document.getElementById('tooltip');
        const scrollContainer = document.getElementById('scroll-container');
        const boxSize = 11, gap = 4, leftMargin = 30, topMargin = 20;

        function getColor(count) {
            if (!count || count === 0) return 'var(--color-calendar-graph-day-bg)';
            if (count <= 3) return 'var(--color-calendar-graph-day-L1-bg)';
            if (count <= 6) return 'var(--color-calendar-graph-day-L2-bg)';
            if (count <= 9) return 'var(--color-calendar-graph-day-L3-bg)';
            return 'var(--color-calendar-graph-day-L4-bg)';
        }

        async function loadDataAndRender() {
            const fallbackData = {
                "2026-03-20": 2, "2026-03-23": 10, "2026-03-24": 3
            };

            try {
                const response = await fetch(`data.json?t=${Date.now()}`);
                if (!response.ok) throw new Error('File not reachable');
                const networkData = await response.json();
                render(networkData);
                updateStats(networkData);
            } catch (err) {
                console.warn("Fallback Mode Activated:", err.message);
                render(fallbackData);
                updateStats(fallbackData);
            }
        }

        function updateStats(data) {
            const total = Object.values(data).reduce((a, b) => a + b, 0);
            document.getElementById('total-count').textContent = `${total} issues in ${year}`;
        }

        function render(networkData) {
            svg.innerHTML = '';
            const days = ['Mon', 'Wed', 'Fri'];
            days.forEach((day, i) => {
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.textContent = day;
                text.setAttribute("x", 0);
                text.setAttribute("y", topMargin + (i * 2 + 1) * (boxSize + gap) + 9);
                text.setAttribute("class", "label");
                svg.appendChild(text);
            });

            const startDate = new Date(year, 0, 1);
            const startDayOffset = (startDate.getDay() + 6) % 7; 
            let currentMonth = -1;

            for (let i = 0; i < 366; i++) {
                const date = new Date(year, 0, 1 + i);
                if (date.getFullYear() !== year) break;

                const dateStr = date.toISOString().split('T')[0];
                const count = networkData[dateStr] || 0;
                const weekIndex = Math.floor((i + startDayOffset) / 7);
                const dayIndex = (i + startDayOffset) % 7;

                if (date.getMonth() !== currentMonth) {
                    currentMonth = date.getMonth();
                    const monthText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    monthText.textContent = date.toLocaleString('en-US', { month: 'short' });
                    monthText.setAttribute("x", leftMargin + weekIndex * (boxSize + gap));
                    monthText.setAttribute("y", 12);
                    monthText.setAttribute("class", "label");
                    svg.appendChild(monthText);
                }

                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", leftMargin + weekIndex * (boxSize + gap));
                rect.setAttribute("y", topMargin + dayIndex * (boxSize + gap));
                rect.setAttribute("width", boxSize);
                rect.setAttribute("height", boxSize);
                rect.setAttribute("rx", 2);
                rect.setAttribute("fill", getColor(count));
                rect.setAttribute("class", "day");

                rect.addEventListener('mouseenter', () => {
                    const msg = count > 0 ? `${count} network issues` : 'No network issues';
                    const formattedDate = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    tooltip.innerHTML = `<strong>${msg}</strong><br/>${formattedDate}`;
                    tooltip.style.visibility = 'visible';
                    tooltip.style.opacity = '1';

                    const box = rect.getBoundingClientRect();
                    tooltip.style.left = (box.left + boxSize / 2) + 'px';
                    tooltip.style.top = (box.top) + 'px';
                });

                rect.addEventListener('mouseleave', () => {
                    tooltip.style.visibility = 'hidden';
                    tooltip.style.opacity = '0';
                });

                svg.appendChild(rect);
            }
            scrollContainer.scrollLeft = 0;
        }

        loadDataAndRender();

        // Custom scrollbar: fade in on scroll, fade out after inactivity
        const scrollThumb = document.getElementById('scrollbar-thumb');
        let scrollTimer = null;

        function updateScrollbar() {
            const { scrollLeft, scrollWidth, clientWidth } = scrollContainer;
            if (scrollWidth <= clientWidth) {
                scrollThumb.style.display = 'none';
                return;
            }
            scrollThumb.style.display = '';
            const trackWidth = scrollContainer.clientWidth;
            const thumbWidth = Math.max(30, (clientWidth / scrollWidth) * trackWidth);
            const maxScrollLeft = scrollWidth - clientWidth;
            const thumbLeft = (scrollLeft / maxScrollLeft) * (trackWidth - thumbWidth);
            scrollThumb.style.width = thumbWidth + 'px';
            scrollThumb.style.left = thumbLeft + 'px';
        }

        scrollContainer.addEventListener('scroll', () => {
            updateScrollbar();
            scrollThumb.classList.add('visible');
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                scrollThumb.classList.remove('visible');
            }, 1500);
        });

        // Initialize scrollbar position
        updateScrollbar();

        // Footer: reveal when scrolled into view using IntersectionObserver
        const footer = document.querySelector('.site-footer');
        const footerObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    footer.classList.add('visible');
                } else {
                    footer.classList.remove('visible');
                }
            });
        }, { threshold: 0.1 });
        footerObserver.observe(footer);
    </script>
</body>
</html>
